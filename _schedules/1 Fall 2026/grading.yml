templates:
    1: &automatic
        type: pass
        subgrades:
            done: boolean
        automatic:
            done: -1
        calculation: done
        auto_publish: true
        hide_calculated: true
        hide_subgrades: true
    3: &manual
        type: float
        subgrades:
            points: integer
        calculation: points
    4: &test
        type: float
        subgrades:
            points: integer
        calculation: points
        is_test: true
        hide_subgrades: true
    5: &manual_float
        type: float
        subgrades:
            points: float
        calculation: points
    6: &written
        type: float
        subgrades:
            instructions: float
            structure_and_style: float
            argumentation: float
        calculation: "instructions + structure_and_style + argumentation"


grades:
    prog_1:
        <<: *manual
        deadline: 04/09/26 18:00
    writ_1:
        <<: *written
        deadline: 04/09/26 18:00
    prog_2:
        <<: *manual
        deadline: 11/09/26 18:00
    writ_2:
        <<: *written
        deadline: 11/09/26 18:00
    prog_3:
