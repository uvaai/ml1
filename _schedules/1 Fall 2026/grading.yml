    prog_6:
        <<: *manual
        deadline: 14/10/26 23:59
    writ_6:
        <<: *written
        deadline: 14/10/26 23:59
    exam: *test
    resit: *test

calculation:
    final:
        programming: 40
        writing: 10
        exam: 50
    retake:
        programming: 40
        writing: 10
        resit: 50

programming:
